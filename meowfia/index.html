<script>
  // The theme is set before the first paint so the page never flashes.
  (function () {
    var t; try { t = localStorage.getItem('meowfia.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
